[platformio]
build_dir = ../../../.pio/license-render-build
libdeps_dir = ../../../.pio/libdeps

[env:cardputer-adv]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_unflags = -std=gnu++11 -fno-exceptions
build_flags = -std=gnu++17 -fexceptions -DARDUINO_USB_CDC_ON_BOOT=1 -DARDUINO_USB_MODE=1 -Wall
lib_deps =
    symlink://../../../third_party/M5Cardputer
    m5stack/M5Unified@0.2.26
    m5stack/M5GFX@0.2.33
    arduino-irremote/IRremote@4.7.1

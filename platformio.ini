[platformio]
src_dir = application
default_envs = cardputer-adv

[env:cardputer-adv]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = pre:tools/platformio_build_info.py
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
monitor_speed = 115200
monitor_dtr = 1
monitor_rts = 1
build_unflags =
    -std=gnu++11
    -fno-exceptions
    -DARDUINO_USB_MODE=1
build_flags =
    -std=gnu++17
    -fexceptions
    -Ithird_party/galuchat/include
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=0
    -Wall
lib_deps =
    m5stack/M5Cardputer@1.1.1
    m5stack/M5Unified@0.2.26
    m5stack/M5GFX@0.2.33
    arduino-irremote/IRremote@4.7.1
